<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>KOSA Bank - 계좌 관리</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <nav class="sidebar">
        <h2>KOSA Bank</h2>
        <ul>
            <li><a href="dashboard.html">대시보드</a></li>
            <li><a href="list.html" class="active">계좌 관리</a></li>
            <li><a href="create.html">계좌 개설</a></li>
            <li><a href="banking.html">입출금 처리</a></li>
        </ul>
        <a href="login.html" class="logout">로그아웃</a>
    </nav>
    <div class="main-wrapper">
        <div class="topbar"><span>운영자(행원) 시스템 접속 중</span></div>
        <div class="content">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">계좌 검색</div>
                </div>
                <div class="form-row">
                    <input type="text" id="keyword" placeholder="계좌번호 또는 소유자명을 입력하세요">
                    <button class="btn-primary" onclick="searchAccounts()">조회</button>
                    <button class="btn-secondary" onclick="loadAllAccounts()">초기화</button>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <div class="card-title">계좌 목록</div>
                    <a href="create.html" class="btn btn-primary">+ 계좌 개설</a>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>계좌번호</th>
                            <th>소유자</th>
                            <th>잔액</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="accountTableBody">
                        <tr><td colspan="4" class="empty-row">데이터를 불러오는 중입니다.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
<script>
    async function loadAllAccounts() {
        document.getElementById('keyword').value = '';
        const res = await fetch('/accounts');
        const data = await res.json();
        renderTable(data);
    }

    async function searchAccounts() {
        const query = document.getElementById('keyword').value.trim();
        if (!query) return loadAllAccounts();

        // 1. 단건 계좌번호 조회
        let res = await fetch(`/accounts/${query}`);
        if (res.ok) {
            const single = await res.json();
            return renderTable([single]);
        }

        // 2. 소유자명 다건 검색
        res = await fetch(`/accounts/search?name=${encodeURIComponent(query)}`);
        if (res.ok) {
            const list = await res.json();
            return renderTable(list);
        }

        renderTable([]);
    }

    function renderTable(list) {
        const tbody = document.getElementById('accountTableBody');
        tbody.innerHTML = '';
        if (!list || list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-row">일치하는 계좌가 없습니다.</td></tr>';
            return;
        }
        list.forEach(acc => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${acc.accountNo}</strong></td>
                <td>${acc.name}</td>
                <td>${acc.balance.toLocaleString()} 원</td>
                <td>
                    <button class="btn-outline" style="padding:4px 8px;" onclick="goToDetail('${acc.accountNo}')">상세/거래내역</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function goToDetail(accountNo) {
        location.href = `detail.html?accountNo=${accountNo}`;
    }

    window.onload = loadAllAccounts;
</script>
</body>
</html>
