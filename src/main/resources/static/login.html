<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>KOSA Bank - 로그인</title>
    <link rel="stylesheet" href="common.css">
    <style>
        body { justify-content: center; align-items: center; background: #0f172a; }
        .login-box { width: 400px; background: #fff; border-radius: 12px; padding: 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .login-box h1 { font-size: 1.5rem; color: #1e293b; text-align: center; margin-bottom: 24px; }
    </style>
</head>
<body>
<div class="login-box">
    <h1>KOSA BANK 행원 시스템</h1>
    <form onsubmit="handleLogin(event)">
        <div class="form-group" style="margin-bottom:16px;">
            <label>행원 아이디</label>
            <input type="text" id="adminId" required placeholder="admin">
        </div>
        <div class="form-group" style="margin-bottom:24px;">
            <label>비밀번호</label>
            <input type="password" id="adminPw" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary" style="width:100%;">로그인</button>
    </form>
</div>
<script>
    function handleLogin(e) {
        e.preventDefault();
        sessionStorage.setItem('adminUser', document.getElementById('adminId').value);
        location.href = 'dashboard.html';
    }
</script>
</body>
</html>
