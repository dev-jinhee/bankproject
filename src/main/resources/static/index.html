<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>은행 계좌 관리 시스템</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: #f4f6f8; padding: 30px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        h2 { font-size: 1.2rem; margin-bottom: 15px; color: #1e293b; border-left: 4px solid #2563eb; padding-left: 8px; }
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        input { flex: 1; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.95rem; min-width: 140px; }
        button { padding: 10px 18px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.95rem; font-weight: bold; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-success { background: #059669; color: white; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-secondary { background: #64748b; color: white; }
        .btn-dark { background: #334155; color: white; }
        button:hover { opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        th { background: #f8fafc; color: #475569; }
        .empty-row { text-align: center; color: #94a3b8; padding: 20px; }
        .badge-deposit { color: #059669; font-weight: bold; }
        .badge-withdraw { color: #dc2626; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 신규 계좌 개설 -->
    <div class="card">
        <h2>신규 계좌 개설</h2>
        <div class="form-row">
            <input type="text" id="newAccountNo" placeholder="계좌번호 (예: 101)">
            <input type="text" id="newName" placeholder="소유자 이름">
            <button class="btn-primary" onclick="createAccount()">개설하기</button>
        </div>
    </div>

    <!-- 2. 계좌 검색 (계좌번호 단건 조회 / 소유자명 다건 조회) -->
    <div class="card">
        <h2>계좌 검색</h2>
        <div class="form-row">
            <input type="text" id="searchAccountNo" placeholder="조회할 계좌번호 입력">
            <button class="btn-primary" onclick="searchByAccountNo()">계좌번호로 조회</button>
        </div>
        <div class="form-row">
            <input type="text" id="searchName" placeholder="조회할 소유자명 입력">
            <button class="btn-dark" onclick="searchByName()">소유자명으로 조회</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>계좌번호</th>
                    <th>소유자</th>
                    <th>잔액</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody id="searchResultBody">
                <tr><td colspan="4" class="empty-row">검색 조건을 입력하고 조회하세요.</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 3. 입출금 처리 -->
    <div class="card">
        <h2>입금 / 출금</h2>
        <div class="form-row">
            <input type="text" id="targetAccountNo" placeholder="대상 계좌번호">
            <input type="number" id="tradeAmount" placeholder="금액 (원)">
            <button class="btn-success" onclick="processBanking('deposit')">입금</button>
            <button class="btn-danger" onclick="processBanking('withdraw')">출금</button>
        </div>
    </div>

    <!-- 4. 전체 계좌 목록 -->
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h2 style="margin:0;">전체 계좌 목록</h2>
            <button class="btn-secondary" onclick="loadAccounts()">목록 새로고침</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>계좌번호</th>
                    <th>소유자</th>
                    <th>잔액</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody id="accountTableBody">
                <tr><td colspan="4" class="empty-row">데이터가 없습니다.</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 5. 거래 내역 상세 조회 -->
    <div class="card">
        <h2>거래 내역 조회</h2>
        <div class="form-row">
            <input type="text" id="historyAccountNo" placeholder="계좌번호 입력">
            <button class="btn-primary" onclick="loadTransactions()">내역 조회</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>일자</th>
                    <th>시간</th>
                    <th>구분</th>
                    <th>거래금액</th>
                    <th>거래 후 잔액</th>
                </tr>
            </thead>
            <tbody id="transactionTableBody">
                <tr><td colspan="5" class="empty-row">계좌를 조회하면 내역이 표시됩니다.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_BASE = '/accounts';

    // 1. 신규 계좌 개설
    async function createAccount() {
        const accountNo = document.getElementById('newAccountNo').value.trim();
        const name = document.getElementById('newName').value.trim();

        if (!accountNo || !name) return alert('계좌번호와 이름을 입력하세요.');

        const res = await fetch(API_BASE, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ accountNo, name })
        });

        const msg = await res.text();
        alert(msg);
        if (res.ok) {
            document.getElementById('newAccountNo').value = '';
            document.getElementById('newName').value = '';
            loadAccounts();
        }
    }

    // 2. 계좌번호로 단건 조회 (GET /accounts/{accountNo})
    async function searchByAccountNo() {
        const accountNo = document.getElementById('searchAccountNo').value.trim();
        if (!accountNo) return alert('계좌번호를 입력하세요.');

        const res = await fetch(`${API_BASE}/${accountNo}`);
        const tbody = document.getElementById('searchResultBody');
        tbody.innerHTML = '';

        if (!res.ok) {
            const errorMsg = await res.text();
            tbody.innerHTML = `<tr><td colspan="4" class="empty-row">${errorMsg || '계좌를 찾을 수 없습니다.'}</td></tr>`;
            return;
        }

        const acc = await res.json();
        tbody.innerHTML = `
            <tr>
                <td>${acc.accountNo}</td>
                <td>${acc.name}</td>
                <td>${acc.balance.toLocaleString()} 원</td>
                <td><button class="btn-secondary" style="padding:4px 8px; font-size:0.8rem;" onclick="selectAccount('${acc.accountNo}')">선택</button></td>
            </tr>
        `;
    }

    // 3. 소유자명으로 계좌 조회 (GET /accounts/search?name=이름)
    async function searchByName() {
        const name = document.getElementById('searchName').value.trim();
        if (!name) return alert('소유자 이름을 입력하세요.');

        const res = await fetch(`${API_BASE}/search?name=${encodeURIComponent(name)}`);
        const tbody = document.getElementById('searchResultBody');
        tbody.innerHTML = '';

        if (!res.ok) return alert('조회 중 오류가 발생했습니다.');

        const data = await res.json();
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-row">일치하는 소유자의 계좌가 없습니다.</td></tr>';
            return;
        }

        data.forEach(acc => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${acc.accountNo}</td>
                <td>${acc.name}</td>
                <td>${acc.balance.toLocaleString()} 원</td>
                <td><button class="btn-secondary" style="padding:4px 8px; font-size:0.8rem;" onclick="selectAccount('${acc.accountNo}')">선택</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 4. 전체 계좌 목록 조회 (GET /accounts)
    async function loadAccounts() {
        const res = await fetch(API_BASE);
        const data = await res.json();
        const tbody = document.getElementById('accountTableBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-row">개설된 계좌가 없습니다.</td></tr>';
            return;
        }

        data.forEach(acc => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${acc.accountNo}</td>
                <td>${acc.name}</td>
                <td>${acc.balance.toLocaleString()} 원</td>
                <td><button class="btn-secondary" style="padding:4px 8px; font-size:0.8rem;" onclick="selectAccount('${acc.accountNo}')">선택</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 5. 입출금 처리 (POST /accounts/{accountNo}/{type})
    async function processBanking(type) {
        const accountNo = document.getElementById('targetAccountNo').value.trim();
        const amount = Number(document.getElementById('tradeAmount').value);

        if (!accountNo || amount <= 0) return alert('계좌번호와 올바른 금액을 입력하세요.');

        const res = await fetch(`${API_BASE}/${accountNo}/${type}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount })
        });

        const msg = await res.text();
        alert(msg);
        if (res.ok) {
            document.getElementById('tradeAmount').value = '';
            loadAccounts();
        }
    }

    // 6. 거래 내역 조회 (GET /accounts/{accountNo}/transactions)
    async function loadTransactions() {
        const accountNo = document.getElementById('historyAccountNo').value.trim();
        if (!accountNo) return alert('조회할 계좌번호를 입력하세요.');

        const res = await fetch(`${API_BASE}/${accountNo}/transactions`);
        if (!res.ok) return alert('계좌를 찾을 수 없거나 조회가 실패했습니다.');

        const data = await res.json();
        const tbody = document.getElementById('transactionTableBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-row">거래 내역이 존재하지 않습니다.</td></tr>';
            return;
        }

        data.forEach(tx => {
            const tr = document.createElement('tr');
            const kindBadge = tx.kind === '입금' 
                ? `<span class="badge-deposit">입금</span>` 
                : `<span class="badge-withdraw">출금</span>`;
            
            // TransactionResponse DTO 필드명(date, time) 반영
            const displayDate = tx.date || tx.transactionDate;
            const displayTime = tx.time || tx.transactionTime;

            tr.innerHTML = `
                <td>${displayDate}</td>
                <td>${displayTime}</td>
                <td>${kindBadge}</td>
                <td>${tx.amount.toLocaleString()} 원</td>
                <td>${tx.balance.toLocaleString()} 원</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 목록/검색 결과에서 '선택' 클릭 시 폼에 계좌번호 자동 세팅
    function selectAccount(accountNo) {
        document.getElementById('targetAccountNo').value = accountNo;
        document.getElementById('historyAccountNo').value = accountNo;
        loadTransactions();
    }

    // 페이지 진입 시 실행
    window.onload = loadAccounts;
</script>

</body>
</html>
