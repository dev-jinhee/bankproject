<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>KOSA Bank - 계좌 개설</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <nav class="sidebar">
        <h2>KOSA Bank</h2>
        <ul>
            <li><a href="dashboard.html">대시보드</a></li>
            <li><a href="list.html">계좌 관리</a></li>
            <li><a href="create.html" class="active">계좌 개설</a></li>
            <li><a href="banking.html">입출금 처리</a></li>
        </ul>
        <a href="login.html" class="logout">로그아웃</a>
    </nav>
    <div class="main-wrapper">
        <div class="topbar"><span>운영자(행원) 시스템 접속 중</span></div>
        <div class="content">
            <div class="card" style="max-width:600px;">
                <div class="card-header">
                    <div class="card-title">신규 계좌 등록</div>
                </div>
                <div class="form-group" style="margin-bottom:16px;">
                    <label>계좌번호</label>
                    <input type="text" id="accountNo" placeholder="예: 100-0001">
                </div>
                <div class="form-group" style="margin-bottom:24px;">
                    <label>예금주 성명</label>
                    <input type="text" id="name" placeholder="홍길동">
                </div>
                <div style="display:flex; gap:10px;">
                    <button class="btn-primary" onclick="submitCreate()">개설 완료</button>
                    <a href="list.html" class="btn btn-secondary">목록으로</a>
                </div>
            </div>
        </div>
    </div>
<script>
    async function submitCreate() {
        const accountNo = document.getElementById('accountNo').value.trim();
        const name = document.getElementById('name').value.trim();

        if (!accountNo || !name) return alert('모든 항목을 입력하세요.');

        const res = await fetch('/accounts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ accountNo, name })
        });

        const msg = await res.text();
        alert(msg);
        if (res.ok) {
            location.href = 'list.html';
        }
    }
</script>
</body>
</html>
